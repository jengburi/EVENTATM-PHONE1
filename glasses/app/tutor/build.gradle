plugins { id 'com.android.application' }
android {
    namespace 'com.jengburi.tutor'
    compileSdk 34
    defaultConfig {
        applicationId 'com.jengburi.tutor'
        minSdk 29
        targetSdk 34
        versionCode 1
        versionName '1.0.0'
    }
    signingConfigs {
        fixedDebug {
            storeFile file('../app/glasses-debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes { debug { minifyEnabled false; signingConfig signingConfigs.fixedDebug } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
    implementation 'com.herohan:UVCAndroid:1.0.13'
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
}
