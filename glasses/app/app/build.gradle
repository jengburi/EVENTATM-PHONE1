plugins { id 'com.android.application' }
android {
    namespace 'com.jengburi.glassesai'
    compileSdk 34
    defaultConfig {
        applicationId 'com.jengburi.glassesai'
        minSdk 29
        targetSdk 34
        versionCode 13
        versionName '1.3'
    }
    signingConfigs {
        fixedDebug {
            storeFile file('glasses-debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes { debug { minifyEnabled false; signingConfig signingConfigs.fixedDebug } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
