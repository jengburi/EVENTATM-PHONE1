name: Build glasses AI app

on:
  push:
    paths:
      - 'glasses/app/**'
      - '.github/workflows/build-glasses-app.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: glasses/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Build debug APKs (full + share)
        run: gradle :app:assembleFullDebug :app:assembleShareDebug :tutor:assembleDebug --no-daemon --stacktrace
      - name: Rename APKs
        run: |
          cp app/build/outputs/apk/full/debug/app-full-debug.apk glasses-ai.apk
          cp app/build/outputs/apk/share/debug/app-share-debug.apk glasses-ai-share.apk
          cp tutor/build/outputs/apk/debug/tutor-debug.apk jengburi-tutor.apk
      - uses: actions/upload-artifact@v4
        with:
          name: glasses-ai-apk
          path: |
            glasses/app/glasses-ai.apk
            glasses/app/glasses-ai-share.apk
            glasses/app/jengburi-tutor.apk
      - name: Publish APK to apk-builds branch
        run: |
          mkdir -p /tmp/out && cp glasses-ai.apk glasses-ai-share.apk jengburi-tutor.apk /tmp/out/
          cd /tmp/out
          git init -q -b apk-builds
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add glasses-ai.apk glasses-ai-share.apk jengburi-tutor.apk
          git commit -q -m "glasses-ai.apk from ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" apk-builds
